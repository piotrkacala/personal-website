<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phonetic Benchmark</title>
  <script type="module" crossorigin src="./assets/index-BHYroYFV.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-mnKC-E3e.css">
</head>
<body>
  <div id="app">
    <div id="view-setup" class="view active">
      <h1 id="setup-title"></h1>
      <div class="form-group">
        <label id="label-language"></label>
        <select id="input-language">
          <option value="en">English</option>
          <option value="pl">Polski</option>
        </select>
      </div>
      <div class="form-group">
        <label id="label-alphabet"></label>
        <select id="input-alphabet">
          <option value="polish">Polish</option>
          <option value="nato">NATO</option>
        </select>
      </div>
      <div class="form-group">
        <label id="label-mode"></label>
        <select id="input-mode">
          <option value="keyboard">Keyboard</option>
          <option value="suggestion">Suggestion</option>
        </select>
      </div>
      <button id="btn-start" class="btn-primary"></button>
    </div>

    <div id="view-exercise" class="view">
      <div id="exercise-header">
        <span id="progress"></span>
      </div>
      <div id="exercise-body">
        <div id="symbol-display"></div>
        <div id="hint-area"></div>
        <div id="input-area"></div>
        <div id="feedback"></div>
      </div>
      <div id="exercise-footer">
        <button id="btn-hint" class="btn-secondary"></button>
      </div>
    </div>

    <div id="view-result" class="view">
      <h1 id="result-title"></h1>
      <div id="result-score"></div>
      <div id="result-details"></div>
      <button id="btn-restart" class="btn-primary"></button>
    </div>
  </div>

  <footer id="app-footer"></footer>

</body>
</html>
