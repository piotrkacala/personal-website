<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonetic Training App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        select, button {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        select {
            background: white;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .symbol-display {
            text-align: center;
            font-size: 120px;
            font-weight: bold;
            color: #667eea;
            margin: 40px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .suggestion-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .suggestion-btn {
            padding: 15px;
            font-size: 18px;
            background: #f8f9fa;
            color: #333;
        }

        .suggestion-btn:hover {
            background: #e9ecef;
        }

        .suggestion-btn.correct {
            background: #28a745;
            color: white;
        }

        .suggestion-btn.wrong {
            background: #dc3545;
            color: white;
        }

        .hint-area {
            text-align: center;
            margin: 20px 0;
            min-height: 60px;
        }

        .hint-text {
            font-size: 24px;
            color: #28a745;
            font-weight: bold;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #667eea;
            transition: width 0.3s;
        }

        .result-screen {
            text-align: center;
        }

        .score-display {
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
            margin: 30px 0;
        }

        .result-details {
            color: #666;
            margin: 20px 0;
            line-height: 1.6;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 12px;
            margin-top: 40px;
        }

        .error-message {
            color: #dc3545;
            text-align: center;
            margin: 10px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="title">Phonetic Training</h1>

        <!-- Setup Screen -->
        <div id="setup-screen" class="screen active">
            <div class="form-group">
                <label id="lang-label">Interface Language / Język interfejsu</label>
                <select id="interface-lang">
                    <option value="en">English</option>
                    <option value="pl">Polski</option>
                </select>
            </div>

            <div class="form-group">
                <label id="alphabet-label">Phonetic Alphabet / Alfabet fonetyczny</label>
                <select id="alphabet-select">
                    <option value="polish">Polish / Polski</option>
                    <option value="nato">NATO</option>
                </select>
            </div>

            <div class="form-group">
                <label id="mode-label">Exercise Mode / Tryb ćwiczenia</label>
                <select id="mode-select">
                    <option value="keyboard">Keyboard / Klawiatura</option>
                    <option value="suggestion">Suggestion / Sugestie</option>
                </select>
            </div>

            <button id="start-btn">Start / Rozpocznij</button>
        </div>

        <!-- Exercise Screen -->
        <div id="exercise-screen" class="screen">
            <div class="progress">
                <span id="progress-text">Question 1 of 26</span>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <div class="symbol-display" id="symbol-display">A</div>

            <div id="keyboard-mode">
                <div class="input-group">
                    <input type="text" id="answer-input" placeholder="Type the codeword...">
                    <button id="submit-btn">Submit</button>
                </div>
            </div>

            <div id="suggestion-mode" style="display: none;">
                <div class="suggestion-buttons" id="suggestion-buttons"></div>
            </div>

            <div class="hint-area">
                <button id="hint-btn">💡 Hint / Podpowiedź</button>
                <div class="hint-text" id="hint-text"></div>
            </div>

            <div class="error-message" id="error-message"></div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen result-screen">
            <h2 id="result-title">Exercise Complete!</h2>
            <div class="score-display" id="score-display">100%</div>
            <div class="result-details" id="result-details"></div>
            <button id="restart-btn">Restart / Rozpocznij ponownie</button>
        </div>

        <div class="footer" id="footer-attribution"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
